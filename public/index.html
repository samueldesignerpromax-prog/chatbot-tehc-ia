<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Tech IA - Chatbot Inteligente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            padding: 12px;
            margin: 5px 0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e0e0e0;
        }

        .chat-item:hover {
            background: #f5f5f5;
            transform: translateX(5px);
        }

        .chat-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .chat-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .chat-date {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .user-info {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .user-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logout-btn {
            width: 100%;
            padding: 8px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #333;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.6;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
        }

        /* Auth Forms */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
            animation: slideUp 0.5s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-box h2 {
            margin-bottom: 30px;
            text-align: center;
            color: #667eea;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <h2 id="authTitle">Login</h2>
            <input type="text" id="authName" placeholder="Nome" class="hidden">
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Senha">
            <button onclick="handleAuth()" id="authButton">Entrar</button>
            <div class="auth-switch" onclick="toggleAuth()">
                <span id="authSwitchText">Não tem conta? Cadastre-se</span>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="container hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🤖 Samuel Tech IA</h2>
                <p>Seu assistente de tecnologia</p>
            </div>
            <button class="new-chat-btn" onclick="newChat()">+ Nova Conversa</button>
            <div class="chats-list" id="chatsList"></div>
            <div class="user-info">
                <div class="user-name" id="userName"></div>
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <h1 id="currentChatTitle">Nova Conversa</h1>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;
        let currentUser = null;
        let currentChatId = null;
        let chats = [];

        // Auth functions
        function toggleAuth() {
            const isLogin = document.getElementById('authTitle').innerText === 'Login';
            const nameField = document.getElementById('authName');
            const authButton = document.getElementById('authButton');
            const authSwitchText = document.getElementById('authSwitchText');
            
            if (isLogin) {
                document.getElementById('authTitle').innerText = 'Cadastro';
                nameField.classList.remove('hidden');
                authButton.innerText = 'Cadastrar';
                authSwitchText.innerText = 'Já tem conta? Faça login';
            } else {
                document.getElementById('authTitle').innerText = 'Login';
                nameField.classList.add('hidden');
                authButton.innerText = 'Entrar';
                authSwitchText.innerText = 'Não tem conta? Cadastre-se';
            }
        }

        async function handleAuth() {
            const isLogin = document.getElementById('authTitle').innerText === 'Login';
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            
            if (isLogin) {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('token', currentToken);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    showMainApp();
                } else {
                    alert('Email ou senha inválidos');
                }
            } else {
                const name = document.getElementById('authName').value;
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('token', currentToken);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    showMainApp();
                } else {
                    alert('Erro ao cadastrar');
                }
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            currentToken = null;
            currentUser = null;
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
        }

        function showMainApp() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userName').innerText = currentUser.name;
            loadChats();
            newChat();
        }

        // Chat functions
        async function loadChats() {
            const response = await fetch('/api/history', {
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            
            if (response.ok) {
                chats = await response.json();
                renderChatsList();
            }
        }

        function renderChatsList() {
            const container = document.getElementById('chatsList');
            container.innerHTML = chats.map(chat => `
                <div class="chat-item ${currentChatId === chat._id ? 'active' : ''}" onclick="loadChat('${chat._id}')">
                    <div class="chat-title">${chat.messages[0]?.content.substring(0, 30) || 'Nova conversa'}...</div>
                    <div class="chat-date">${new Date(chat.createdAt).toLocaleDateString()}</div>
                </div>
            `).join('');
        }

        async function newChat() {
            currentChatId = null;
            document.getElementById('currentChatTitle').innerText = 'Nova Conversa';
            document.getElementById('messages').innerHTML = '';
            document.getElementById('messageInput').value = '';
            
            // Add welcome message
            addMessage('assistant', 'Olá! Sou o Samuel Tech IA. Como posso ajudar você hoje?');
        }

        async function loadChat(chatId) {
            currentChatId = chatId;
            const response = await fetch(`/api/chat/${chatId}`, {
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            
            if (response.ok) {
                const chat = await response.json();
                document.getElementById('messages').innerHTML = '';
                chat.messages.forEach(msg => {
                    addMessage(msg.role, msg.content);
                });
                renderChatsList();
            }
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${content}
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                </div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${currentToken}`
                },
                body: JSON.stringify({ message, chatId: currentChatId })
            });
            
            if (response.ok) {
                const data = await response.json();
                addMessage('assistant', data.message);
                currentChatId = data.chatId;
                loadChats();
                document.getElementById('currentChatTitle').innerText = 'Conversa';
            } else {
                addMessage('assistant', 'Desculpe, ocorreu um erro. Tente novamente.');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Check for saved session
        const savedToken = localStorage.getItem('token');
        const savedUser = localStorage.getItem('user');
        
        if (savedToken && savedUser) {
            currentToken = savedToken;
            currentUser = JSON.parse(savedUser);
            showMainApp();
        }
    </script>
</body>
</html>
